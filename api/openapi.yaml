      description: Virtual path inside the jail (default "/")
      in: query
      name: path
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid or rejected request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with concurrent state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Resource exists but access is denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OK:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OK'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials/session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BatchStatusResponse:
      properties:
        active:
          type: boolean
        paths:
          items:
            type: string
          type: array
      required:
        - active
        - paths
      type: object
    BatchThumbnailsRequest:
      properties:
        paths:
          items:
            type: string
          type: array
      required:
        - paths
      type: object
    BatchThumbnailsResponse:
      properties:
        paths:
          items:
            type: string
          type: array
        skipped:
          additionalProperties:
            type: string
          type: object
        status:
          example: started
          type: string
        total:
          type: integer
      required:
        - status
        - paths
        - skipped
        - total
      type: object
    ChangePasswordRequest:
      properties:
        current_password:
          format: password
          type: string
        new_password:
          format: password
          type: string
      required:
        - current_password
        - new_password
      type: object
    Config:
      properties:
        auth_required:
          type: boolean
        ffmpeg_available:
          type: boolean
        ffprobe_available:
          type: boolean
        host:
          type: string
        port:
          type: integer
        session_ttl_days:
          type: integer
        sevenzip_available:
          type: boolean
        show_dotfiles:
          type: boolean
        tar_available:
          type: boolean
        unrar_available:
          type: boolean
        unzip_available:
          type: boolean
        wipe_methods:
          items:
            $ref: '#/components/schemas/WipeMethod'
          type: array
      required:
        - host
        - port
        - show_dotfiles
        - auth_required
        - session_ttl_days
        - wipe_methods
        - ffmpeg_available
        - ffprobe_available
        - unzip_available
        - sevenzip_available
        - unrar_available
        - tar_available
      type: object
    CreateFileResponse:
      properties:
        path:
          type: string
        status:
          type: string
      required:
        - status
        - path
      type: object
    DeletePrefs:
      properties:
        default_wipe:
          default: false
          description: Remember to enable secure wipe in the delete dialog
          type: boolean
        wipe_method:
          default: fast
          description: Remembered secure-delete algorithm id (see /api/config wipe_methods)
          type: string
      type: object
    DeleteRequest:
      properties:
        method:
          default: fast
          description: Secure-delete algorithm id (see /api/config wipe_methods)
          type: string
        path:
          description: Single target (alternative to paths)
          type: string
        paths:
          items:
            type: string
          type: array
        wipe:
          default: false
          type: boolean
      required:
        - path
      type: object
    DiskUsage:
      properties:
        free:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
        used:
          format: int64
          type: integer
        used_pct:
          type: number
      required:
        - total
        - free
        - used
        - used_pct
      type: object
    Error:
      properties:
        error:
          type: string
      required:
        - error
      type: object
    ExtractArchiveRequest:
      properties:
        password:
          description: Archive password for encrypted archives
          type: string
        path:
          type: string
      required:
        - path
      type: object
    Favourite:
      properties:
        name:
          type: string
        path:
          type: string
      required:
        - name
        - path
      type: object
    FavouriteAddRequest:
      properties:
        name:
          maxLength: 64
          type: string
        path:
          type: string
      required:
        - path
      type: object
    FavouritesUpdateRequest:
      properties:
        favourites:
          items:
            $ref: '#/components/schemas/Favourite'
          maxItems: 100
          type: array
      required:
        - favourites
      type: object
    FileEntry:
      properties:
        is_dir:
          type: boolean
        mime_hint:
          type: string
        mod_time:
          format: date-time
          type: string
        mode:
          description: os.FileMode bitmask
          format: int64
          type: integer
        name:
          type: string
        path:
          type: string
        size:
          format: int64
          type: integer
      required:
        - name
        - path
        - size
        - mod_time
        - is_dir
        - mode
        - mime_hint
      type: object
    FileEntryList:
      items:
        $ref: '#/components/schemas/FileEntry'
      type: array
    FolderInfoResponse:
      properties:
        file_count:
          format: int64
          type: integer
        mod_time:
          format: date-time
          type: string
        name:
          type: string
        path:
          type: string
        total_size:
          format: int64
          type: integer
      required:
        - name
        - path
        - total_size
        - file_count
      type: object
    InfoResponse:
      properties:
        disk:
          $ref: '#/components/schemas/DiskUsage'
        disk_error:
          description: Present when statfs failed (disk may be null)
          nullable: true
          type: string
        file:
          $ref: '#/components/schemas/FileEntry'
      required:
        - file
        - disk
        - disk_error
      type: object
    IntervalsResponse:
      properties:
        intervals:
          items:
            $ref: '#/components/schemas/TimeSpan'
          type: array
      required:
        - intervals
      type: object
    LoginRequest:
      properties:
        password:
          format: password
          type: string
        remember_me:
          default: false
          type: boolean
        username:
          type: string
      required:
        - username
        - password
      type: object
    LoginResponse:
      properties:
        status:
          enum:
            - ok
          type: string
        username:
          type: string
      required:
        - status
        - username
      type: object
    MeResponse:
      properties:
        auth_required:
          type: boolean
        username:
          type: string
      required:
        - username
        - auth_required
      type: object
    MoveCopyRequest:
      properties:
        dst:
          type: string
        on_conflict:
          default: error
          enum:
            - error
            - overwrite
            - rename
          type: string
        src:
          description: Single source (alternative to srcs)
          type: string
        srcs:
          items:
            type: string
          type: array
      required:
        - dst
      type: object
    NDJSONError:
      properties:
        code:
          description: Machine-readable code, e.g. "destination_exists"
          type: string
        conflicts:
          description: Conflicting destination paths with code destination_exists
          items:
            type: string
          type: array
        message:
          type: string
        tool:
          type: string
        type:
          enum:
            - error
          type: string
      required:
        - type
        - message
      type: object
    NDJSONEvent:
      oneOf:
        - $ref: '#/components/schemas/NDJSONProgress'
        - $ref: '#/components/schemas/NDJSONResult'
        - $ref: '#/components/schemas/NDJSONError'
    NDJSONProgress:
      properties:
        command:
          description: ffmpeg command run (video extract)
          type: string
        current:
          description: Basename of the file currently being processed
          type: string
        done:
          description: Files processed so far (transfer streams)
          type: integer
        filePct:
          description: Fraction of the current file completed (0-1), when measurable
          nullable: true
          type: number
        filename:
          description: Archive basename being extracted
          type: string
        line:
          description: Raw extraction tool output line (archive extract)
          type: string
        segment:
          description: 1-based segment index (video extract)
          type: integer
        status:
          description: Special progress status, e.g. "concatenating"
          type: string
        tool:
          description: Extraction tool name
          type: string
        total:
          description: Total files in the operation
          type: integer
        type:
          enum:
            - progress
          type: string
      required:
        - type
      type: object
    NDJSONResult:
      properties:
        dest:
          description: Virtual path of the extraction destination (archive extract)
          type: string
        output:
          description: Virtual path of the produced file (video extract)
          type: string
        status:
          enum:
            - ok
          type: string
        tool:
          type: string
        type:
          enum:
            - result
          type: string
      required:
        - type
        - status
      type: object
    NDJSONStream:
      description: One NDJSON event per line (Content-Type application/x-ndjson)
      properties:
        events:
          items:
            $ref: '#/components/schemas/NDJSONEvent'
          type: array
      type: object
    NameRequest:
      properties:
        name:
          description: Single entry name, no path separators
          type: string
        path:
          type: string
      required:
        - path
        - name
      type: object
    OK:
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    PathRequest:
      properties:
        path:
          type: string
      required:
        - path
      type: object
    ReadResponse:
      properties:
        content:
          type: string
      required:
        - content
      type: object
    RenameRequest:
      properties:
        newname:
          type: string
        path:
          type: string
      required:
        - path
        - newname
      type: object
    ShowDotfilesRequest:
      properties:
        show_dotfiles:
          type: boolean
      required:
        - show_dotfiles
      type: object
    SnapTimeRequest:
      properties:
        path:
          type: string
        time:
          minimum: 0
          type: number
      required:
        - path
        - time
      type: object
    SnapTimeResponse:
      properties:
        next:
          type: number
        prev:
          type: number
      required:
        - prev
        - next
      type: object
    ThumbnailEntry:
      properties:
        index:
          description: 1-based frame number
          type: integer
        name:
          description: On-disk frame filename, e.g. "00001.jpg"
          type: string
        time:
          description: Keyframe PTS in seconds
          type: number
      required:
        - name
        - time
        - index
      type: object
    ThumbnailsResponse:
      properties:
        completed:
          description: Frames written so far while generating
          type: integer
        error:
          description: Generation failure when not generating
          type: string
        generating:
          type: boolean
        thumbnails:
          items:
            $ref: '#/components/schemas/ThumbnailEntry'
          type: array
        total:
          description: Estimated thumbnail count while generating
          type: integer
        waiting:
          type: boolean
      required:
        - thumbnails
        - generating
      type: object
    TimeSpan:
      properties:
        end:
          description: End seconds, finite and strictly after start
          type: number
        start:
          description: Start seconds (>= 0)
          type: number
      required:
        - start
        - end
      type: object
    VideoExtractRequest:
      properties:
        path:
          type: string
        segments:
          items:
            $ref: '#/components/schemas/TimeSpan'
          maxItems: 32
          type: array
      required:
        - path
        - segments
      type: object
    VideoSaveIntervalsRequest:
      properties:
        intervals:
          items:
            $ref: '#/components/schemas/TimeSpan'
          type: array
        path:
          type: string
      required:
        - path
        - intervals
      type: object
    WipeMethod:
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - description
      type: object
    WriteRequest:
      properties:
        content:
          type: string
        path:
          type: string
      required:
        - path
        - content
      type: object
    ZipRequest:
      properties:
        paths:
          items:
            type: string
          type: array
      required:
        - paths
      type: object
