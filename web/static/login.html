<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>filex — login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">

<div id="toast-container"></div>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3h7l2 3h9a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
      </svg>
      <span>filex</span>
    </div>
    <p class="login-subtitle">File Browser</p>

    <form id="login-form" autocomplete="on" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="Enter your username"
          autocomplete="username"
          required
          autofocus
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="password-toggle" id="pwd-toggle" title="Show/hide password">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M20.188 10.934a9 9 0 0 1 0 2.132 9 9 0 0 1-16.376 0 9 9 0 0 1 0-2.132 9 9 0 0 1 16.376 0z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button type="submit" class="btn primary login-btn" id="login-btn">
        Sign In
      </button>
    </form>
  </div>
</div>

<script>
'use strict';

// Password toggle
document.getElementById('pwd-toggle').addEventListener('click', () => {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.innerHTML = `<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>`;
  } else {
    pwd.type = 'password';
    icon.innerHTML = `<circle cx="12" cy="12" r="3"/><path d="M20.188 10.934a9 9 0 0 1 0 2.132 9 9 0 0 1-16.376 0 9 9 0 0 1 0-2.132 9 9 0 0 1 16.376 0z"/>`;
  }
});

// Login form
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  if (!username || !password) {
    errorEl.textContent = 'Please enter username and password.';
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in\u2026';
  errorEl.style.display = 'none';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) {
      errorEl.textContent = data.error || 'Login failed.';
      errorEl.style.display = 'block';
      return;
    }
    // Redirect to main app (or back to original page)
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || '/';
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

// If Enter is pressed in username field, focus password
document.getElementById('username').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
